name: Tests

on:
  pull_request:
    branches:
      - master

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest (PHP 8.5, MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          # Matches the `mysql_test` connection defaults in config/database.php:
          # user `root` with an empty password, database `tdd_ai_app_db_test`.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: tdd_ai_app_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Create .env
        run: cp .env.example .env

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        # phpunit.xml pins the suite to DB_CONNECTION=mysql_test and
        # DB_DATABASE_TEST=tdd_ai_app_db_test, so no DB env overrides are needed
        # here. LazilyRefreshDatabase migrates the schema on the first test that
        # touches the database.
        run: php artisan test
